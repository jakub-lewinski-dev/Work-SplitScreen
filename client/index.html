<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work SplitScreen - LAN Notepad</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #1e1e1e;
            --pane-bg: #252526;
            --border-color: #333333;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --header-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            gap: 2px;
            background-color: var(--border-color);
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--pane-bg);
        }

        .pane-header {
            background-color: var(--header-bg);
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            font-size: 12px;
            color: #888;
        }

        textarea {
            flex: 1;
            background-color: var(--pane-bg);
            color: var(--text-color);
            border: none;
            padding: 15px;
            font-size: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #555;
        }
    </style>
</head>
<body>

    <body>
    <div class="app-container">
        <!-- Boczny panel (Sidebar / Aside) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Workspace</h2>
                <!-- Przycisk do chowania/otwierania panelu -->
                <button id="toggle-sidebar" aria-label="Toggle Sidebar">◀</button>
            </div>

            <!-- Rozwijana sekcja / menu dodawania nowego obiektu -->
            <div class="dropdown-section">
                <button class="dropdown-toggle" id="new-item-btn">+ Nowy element ▾</button>
                <div class="dropdown-menu" id="new-item-menu">
                    <button data-type="text">📝 Edytor tekstu</button>
                    <button data-type="paint">🎨 Prosty Paint</button>
                    <button data-type="calc">🧮 Kalkulator</button>
                </div>
            </div>

            <!-- Lista wszystkich otwartych plików / obiektów -->
            <div class="open-files-container">
                <h3>Otwarte pliki</h3>
                <ul class="files-list" id="files-list">
                    <!-- Przykładowy element, jak to będzie wyglądać -->
                    <li class="file-item active">
                        <span class="file-name">Notatka_1.txt</span>
                        <div class="file-actions">
                            <button class="save-file" title="Zapisz na dysku">💾</button>
                            <button class="close-file" title="Zamknij">✕</button>
                        </div>
                    </li>
                    <li class="file-item">
                        <span class="file-name">Szkic_1.paint</span>
                        <div class="file-actions">
                            <button class="save-file" title="Zapisz na dysku">💾</button>
                            <button class="close-file" title="Zamknij">✕</button>
                        </div>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Główny obszar roboczy (Main), na starcie pusty -->
        <main class="main-content" id="main-content">
            <!-- Tutaj dynamicznie będą wskakiwać split-screeny lub aktywne aplikacje -->
            <div class="empty-state">
                <p>Wybierz lub stwórz nowy element z menu bocznego, aby rozpocząć pracę.</p>
            </div>
        </main>
    </div>
</body>

    <script>
        // Place for connecting your Socket.io / WebSocket backend logic
        const leftEditor = document.getElementById('left-editor');
        const rightEditor = document.getElementById('right-editor');

        leftEditor.addEventListener('input', (e) => {
            console.log('Left editor changed:', e.target.value);
            // Backend emit will go here later
        });

        rightEditor.addEventListener('input', (e) => {
            console.log('Right editor changed:', e.target.value);
            // Backend emit will go here later
        });
    </script>
</body>
</html>
