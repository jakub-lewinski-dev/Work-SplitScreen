<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work SplitScreen - LAN Notepad</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --pane-bg: #252526;
            --border-color: #333333;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --header-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            gap: 2px;
            background-color: var(--border-color);
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--pane-bg);
        }

        .pane-header {
            background-color: var(--header-bg);
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            font-size: 12px;
            color: #888;
        }

        textarea {
            flex: 1;
            background-color: var(--pane-bg);
            color: var(--text-color);
            border: none;
            padding: 15px;
            font-size: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Left Pane -->
        <div class="pane">
            <div class="pane-header">
                <span>File 1 (Left)</span>
                <span class="status-indicator" id="left-status">Ready</span>
            </div>
            <textarea id="left-editor" placeholder="Type text for the left file here..."></textarea>
        </div>

        <!-- Right Pane -->
        <div class="pane">
            <div class="pane-header">
                <span>File 2 (Right)</span>
                <span class="status-indicator" id="right-status">Ready</span>
            </div>
            <textarea id="right-editor" placeholder="Type text for the right file here..."></textarea>
        </div>
    </div>

    <script>
        // Place for connecting your Socket.io / WebSocket backend logic
        const leftEditor = document.getElementById('left-editor');
        const rightEditor = document.getElementById('right-editor');

        leftEditor.addEventListener('input', (e) => {
            console.log('Left editor changed:', e.target.value);
            // Backend emit will go here later
        });

        rightEditor.addEventListener('input', (e) => {
            console.log('Right editor changed:', e.target.value);
            // Backend emit will go here later
        });
    </script>
</body>
</html>
