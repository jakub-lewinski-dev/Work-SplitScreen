<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work SplitScreen - LAN Notepad</title>
    <link rel="stylesheet" href="style.css"><link>
</head>
<body>

    <body>
    <div class="app-container">
        <!-- Boczny panel (Sidebar / Aside) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Workspace</h2>
                <!-- Przycisk do chowania/otwierania panelu -->
                <button id="toggle-sidebar" aria-label="Toggle Sidebar">◀</button>
            </div>

            <!-- Rozwijana sekcja / menu dodawania nowego obiektu -->
            <div class="dropdown-section">
                <!-- Przycisk sterujący -->
                <button class="dropdown-toggle" id="new-item-btn" onclick="toggleNewItemMenu()">
                    + Nowy element ▾
                </button>
                
                <!-- Rozwijane menu -->
                <div class="dropdown-menu" id="new-item-menu">
                    <button onclick="createTextEditorFile()">📝 Edytor tekstu</button>
                    <button onclick="createPaintFile()">🎨 Prosty Paint</button>
                    <button onclick="openCalc()">🧮 Kalkulator</button>
                    <button onclick="createGraphFile();">📈 Graph</button>
                </div>
            </div>

            <!-- ===== TUTAJ DODAJEMY SEKCJĘ HOST / JOIN ===== -->
            <div class="connection-section" style="padding: 12px 16px; background: #202225; border-bottom: 1px solid #2f3136;">
                <div style="font-size: 11px; font-weight: bold; color: #8e9297; text-transform: uppercase; margin-bottom: 6px;">Tryb połączenia LAN</div>
                
                <!-- Status połączenia -->
                <div id="connection-status" style="font-size: 12px; color: #43b581; margin-bottom: 8px; font-weight: bold;">
                    🟢 Tryb: Host (Lokalny)
                </div>

                <!-- Przyciski i pole do wpisywania IP -->
                <div style="display: flex; gap: 6px; flex-direction: column;">
                    <button id="btn-mode-host" style="background: #5865f2; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
                        🏠 Hostuj sesję
                    </button>

                    <div style="display: flex; gap: 4px; margin-top: 2px;">
                        <input type="text" id="join-ip-input" placeholder="IP Hosta (np. 192.168.1.15:3000)" style="flex: 1; padding: 6px; background: #36393f; border: 1px solid #484b52; color: white; border-radius: 4px; font-size: 11px;">
                        <button id="btn-mode-join" style="background: #4f545c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
                            Dołącz
                        </button>
                    </div>
                </div>
            </div>
            <!-- ============================================== -->
             
            <!-- Lista wszystkich otwartych plików / obiektów -->
            <div class="open-files-container">
                <h3>Otwarte pliki</h3>
                <ul class="files-list" id="files-list">
                    
                </ul>
            </div>
        </aside>

        <!-- Główny obszar roboczy (Main), na starcie pusty -->
        <main class="main-content" id="main-content">
            <!-- Tutaj dynamicznie będą wskakiwać split-screeny lub aktywne aplikacje -->
            <div class="empty-state">
                <p>Wybierz lub stwórz nowy element z menu bocznego, aby rozpocząć pracę.</p>
            </div>
        </main>
    </div>
</body>
</div>
</body>

<!-- Dołączenie biblioteki Socket.io -->
<script src="/socket.io/socket.io.js"></script>
<script src="localscript.js"></script>

</html>
