<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work SplitScreen - LAN Notepad</title>
    <link rel="stylesheet" href="style.css"><link>
</head>
<body>

    <body>
    <div class="app-container">
        <!-- Boczny panel (Sidebar / Aside) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Workspace</h2>
                <!-- Przycisk do chowania/otwierania panelu -->
                <button id="toggle-sidebar" aria-label="Toggle Sidebar">◀</button>
            </div>

            <!-- Rozwijana sekcja / menu dodawania nowego obiektu -->
            <div class="dropdown-section">
                <!-- Przycisk sterujący -->
                <button class="dropdown-toggle" id="new-item-btn" onclick="toggleNewItemMenu()">
                    + Nowy element ▾
                </button>
                
                <!-- Rozwijane menu -->
                <div class="dropdown-menu" id="new-item-menu">
                    <button onclick="createTextEditorFile()">📝 Edytor tekstu</button>
                    <button>🎨 Prosty Paint</button>
                    <button>🧮 Kalkulator</button>
                </div>
            </div>

            <!-- Lista wszystkich otwartych plików / obiektów -->
            <div class="open-files-container">
                <h3>Otwarte pliki</h3>
                <ul class="files-list" id="files-list">
                    
                </ul>
            </div>
        </aside>

        <!-- Główny obszar roboczy (Main), na starcie pusty -->
        <main class="main-content" id="main-content">
            <!-- Tutaj dynamicznie będą wskakiwać split-screeny lub aktywne aplikacje -->
            <div class="empty-state">
                <p>Wybierz lub stwórz nowy element z menu bocznego, aby rozpocząć pracę.</p>
            </div>
        </main>
    </div>
</body>
</div>
</body>

<!-- Dołączenie biblioteki Socket.io -->
<script src="/socket.io/socket.io.js"></script>
<script src="localscript.js"></script>

</html>
